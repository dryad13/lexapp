[project]
name = "uk-legal-onboarding-mvp-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
"email-validator>=2.0.0",
  "fastapi==0.115.6",
  "uvicorn[standard]==0.32.1",
  "pydantic==2.10.3",
  "pydantic-settings==2.6.1",
  "SQLAlchemy==2.0.36",
  "asyncpg==0.30.0",
  "alembic==1.14.0",
  "python-jose[cryptography]==3.3.0",
  "passlib[bcrypt]==1.7.4",
  "bcrypt==4.0.1",
  "python-multipart==0.0.12",
  "slowapi==0.1.9",
  "celery==5.4.0",
  "redis==5.2.0",
  "httpx==0.27.2",
  "stripe==11.1.0",
  "reportlab==4.2.5",
  "orjson==3.10.12",
  "pytest==8.3.4",
  "pytest-asyncio==0.24.0"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
