# Postgres + Redis for LexAssist-3 automated tests.
# Prefer: docker compose -f docker-compose.test.yml up -d
# Fallback (no Docker): local Postgres DB `lexassist_test` on port 5432 + Redis 6379.
services:
  postgres:
    image: postgres:16-alpine
    container_name: lexassist-test-pg
    environment:
      POSTGRES_USER: lexassist
      POSTGRES_PASSWORD: lexassist
      POSTGRES_DB: lexassist_test
    ports:
      - "54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lexassist -d lexassist_test"]
      interval: 2s
      timeout: 5s
      retries: 20
    volumes:
      - lexassist_test_pg:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: lexassist-test-redis
    ports:
      - "63799:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 20

volumes:
  lexassist_test_pg:
