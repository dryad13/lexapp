# Render Blueprint for LexAssist-3 (web + Postgres). Redis is a hard prerequisite.
services:
  - type: web
    name: lexassist
    runtime: docker
    plan: starter
    region: oregon
    rootDir: LexAssist-3
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: lexassist3-db
          property: connectionString
      - key: ENCRYPTION_KEY
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      # Provision Redis in the Render dashboard (or external) and set REDIS_URL before deploy.
      # Boot exits if Redis is unreachable while REQUIRE_REDIS=1.
      - key: REQUIRE_REDIS
        value: "1"
      - key: REDIS_URL
        sync: false
      - key: SEED_DEMO_USERS
        value: "0"
      - key: MFA_REQUIRED_FOR_ADMINS
        value: "1"
      - key: PLATFORM_ADMIN_USER
        sync: false
      - key: PLATFORM_ADMIN_PASS
        sync: false
      # Comma-separated browser origins allowed for credentialed CORS, e.g. https://app.example.com
      - key: CORS_ORIGINS
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_ID
        sync: false
      - key: DATABASE_SSL
        value: "true"
      - key: DATABASE_SSL_REJECT_UNAUTHORIZED
        value: "false"

databases:
  - name: lexassist3-db
    plan: basic_256mb
    region: oregon
