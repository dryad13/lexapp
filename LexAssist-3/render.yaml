# Render Blueprint for LexAssist-3 (single web service + Postgres)
services:
  - type: web
    name: lexassist
    runtime: docker
    plan: starter
    region: oregon
    rootDir: LexAssist-3
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: lexassist3-db
          property: connectionString
      - key: ENCRYPTION_KEY
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      # Set in the Render dashboard (no Terraform in this round):
      # REDIS_URL, STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET, STRIPE_PRICE_ID, DATABASE_SSL=true
      # Redis is not provisioned yet. While REQUIRE_REDIS is "0" the service
      # degrades to in-memory sessions, rate limiting and job queues instead of
      # exiting at boot. Flip to "1" once REDIS_URL points at a real instance.
      - key: REQUIRE_REDIS
        value: "0"
      - key: REDIS_URL
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_ID
        sync: false
      - key: DATABASE_SSL
        value: "true"
      # Keep false on Render managed Postgres (self-signed chain). Set true only with a private CA.
      - key: DATABASE_SSL_REJECT_UNAUTHORIZED
        value: "false"

databases:
  - name: lexassist3-db
    plan: basic_256mb
    region: oregon
