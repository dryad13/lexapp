# LexAssist — Render Blueprint (API + Postgres)
# Frontends stay on Netlify.

databases:
  - name: lexapp-db
    plan: basic-256mb
    databaseName: lexapp
    user: lexapp

services:
  - type: web
    name: lexapp-api
    runtime: docker
    plan: starter
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: ./apps/api
    healthCheckPath: /health
    disk:
      name: uploads
      mountPath: /app/data
      sizeGB: 1
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: lexapp-db
          property: connectionString
      - key: UPLOAD_DIR
        value: /app/data/uploads
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ACCESS_TTL_MIN
        value: "15"
      - key: JWT_REFRESH_TTL_DAYS
        value: "14"
      - key: REDIS_URL
        value: redis://localhost:6379/0
      - key: CELERY_BROKER_URL
        value: redis://localhost:6379/1
      - key: CELERY_RESULT_BACKEND
        value: redis://localhost:6379/2
      - key: MAX_UPLOAD_MB
        value: "10"
      # Set these in the Render dashboard after first deploy:
      # FIRM_PORTAL_ORIGIN, CLIENT_PORTAL_ORIGIN, PUBLIC_BASE_URL
      # STRIPE_SECRET_KEY, STRIPE_PUBLISHABLE_KEY, STRIPE_WEBHOOK_SECRET
      - key: FIRM_PORTAL_ORIGIN
        sync: false
      - key: CLIENT_PORTAL_ORIGIN
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
